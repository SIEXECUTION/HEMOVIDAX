services:
  - type: web
    name: hemovida-backend
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn hemovida_project.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: https://hemovidax.siexecution2026.workers.dev
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: USE_SQLITE
        value: "False"
